# Local / VM deployment target for the CD pipeline.
#
#   docker compose -f deployment/docker-compose.yml up -d --build
#   python deployment/smoke_test.py --base-url http://localhost:8000
#
# `IMAGE` defaults to a locally built image; CD overrides it with the registry tag
# so the same file deploys the exact artifact CI published.

services:
  inference:
    image: ${IMAGE:-cats-vs-dogs-inference:local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cats-vs-dogs-inference
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      IMAGE_TAG: ${IMAGE_TAG:-local}
      LOG_LEVEL: INFO
      MODEL_DIR: /app/models
    volumes:
      # Persist request/feedback logs outside the container for monitoring.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Scrapes /metrics from the inference service every 15s.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cats-vs-dogs-prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - inference
    restart: unless-stopped
