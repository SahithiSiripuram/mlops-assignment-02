apiVersion: v1
kind: Service
metadata:
  name: cats-vs-dogs-inference
  labels:
    app: cats-vs-dogs-inference
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  # NodePort works on kind/minikube/microk8s without a cloud load balancer.
  type: NodePort
  selector:
    app: cats-vs-dogs-inference
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
