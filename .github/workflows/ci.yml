# CI (M3): on every push and pull request -- check out, install, lint, unit-test,
# build the Docker image, smoke-test the container, then publish the image to GHCR.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- lint + tests
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check src tests deployment scripts
          ruff format --check src tests || true

      - name: Run unit tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ------------------------------------------------- build, verify, publish image
  build-and-push:
    name: Build, smoke-test & publish image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Pull requests from forks cannot access the registry token, so publishing
        # is limited to branches in this repository.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build image (load locally for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cats-vs-dogs-inference:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container
        run: |
          docker run -d --name inference -p 8000:8000 \
            -e IMAGE_TAG=${{ github.sha }} cats-vs-dogs-inference:ci
          echo "waiting for the service to come up ..."

      - name: Smoke-test the container
        run: |
          pip install requests pillow
          python deployment/smoke_test.py --base-url http://localhost:8000 --wait 180

      - name: Print container logs
        if: always()
        run: docker logs inference

      - name: Tear down the container
        if: always()
        run: docker rm -f inference || true

      - name: Push the verified image to GHCR
        # Only images that passed the smoke test are published.
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the published image
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image published to GHCR"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
